<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Remover</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            background: #f8f9ff;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        label {
            font-weight: bold;
            color: #333;
        }
        
        input[type="range"] {
            width: 150px;
        }
        
        button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .canvas-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .canvas-wrapper {
            text-align: center;
            flex: 1;
            min-width: 300px;
        }
        
        .canvas-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        canvas {
            border: 2px solid #ddd;
            border-radius: 10px;
            max-width: 100%;
            height: auto;
        }
        
        .download-btn {
            margin-top: 20px;
            background: linear-gradient(45deg, #28a745, #20c997);
        }
        
        .status {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
        }
        
        .status.processing {
            background: #fff3cd;
            color: #856404;
            display: block;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .checkerboard {
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Background Remover</h1>
        
        <div class="upload-area" onclick="document.getElementById('imageInput').click()">
            <div class="upload-text">📸 Click to upload an image</div>
            <div class="upload-hint">or drag and drop here</div>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="threshold">Edge Sensitivity:</label>
                <input type="range" id="threshold" min="10" max="100" value="50">
                <span id="thresholdValue">50</span>
            </div>
            
            <div class="control-group">
                <label for="blur">Blur Amount:</label>
                <input type="range" id="blur" min="0" max="10" value="2">
                <span id="blurValue">2</span>
            </div>
            
            <button onclick="processImage()" id="processBtn" disabled>Remove Background</button>
            <button onclick="resetSettings()">Reset Settings</button>
        </div>
        
        <div id="status" class="status"></div>
        
        <div class="canvas-container">
            <div class="canvas-wrapper">
                <div class="canvas-title">Original Image</div>
                <canvas id="originalCanvas"></canvas>
            </div>
            
            <div class="canvas-wrapper">
                <div class="canvas-title">Background Removed</div>
                <div class="checkerboard" style="display: inline-block; border-radius: 10px;">
                    <canvas id="resultCanvas"></canvas>
                </div>
                <br>
                <button class="download-btn" onclick="downloadImage()" id="downloadBtn" style="display: none;">
                    💾 Download Result
                </button>
            </div>
        </div>
    </div>

    <script>
        let originalImageData = null;
        let processedImageData = null;
        
        // File input handling
        const imageInput = document.getElementById('imageInput');
        const originalCanvas = document.getElementById('originalCanvas');
        const resultCanvas = document.getElementById('resultCanvas');
        const originalCtx = originalCanvas.getContext('2d');
        const resultCtx = resultCanvas.getContext('2d');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        
        // Drag and drop handling
        const uploadArea = document.querySelector('.upload-area');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleImageUpload(files[0]);
            }
        });
        
        // Slider updates
        const thresholdSlider = document.getElementById('threshold');
        const blurSlider = document.getElementById('blur');
        const thresholdValue = document.getElementById('thresholdValue');
        const blurValue = document.getElementById('blurValue');
        
        thresholdSlider.addEventListener('input', (e) => {
            thresholdValue.textContent = e.target.value;
        });
        
        blurSlider.addEventListener('input', (e) => {
            blurValue.textContent = e.target.value;
        });
        
        imageInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleImageUpload(e.target.files[0]);
            }
        });
        
        function handleImageUpload(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    displayOriginalImage(img);
                    processBtn.disabled = false;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function displayOriginalImage(img) {
            const maxSize = 400;
            let { width, height } = img;
            
            if (width > maxSize || height > maxSize) {
                const ratio = Math.min(maxSize / width, maxSize / height);
                width *= ratio;
                height *= ratio;
            }
            
            originalCanvas.width = width;
            originalCanvas.height = height;
            resultCanvas.width = width;
            resultCanvas.height = height;
            
            originalCtx.drawImage(img, 0, 0, width, height);
            originalImageData = originalCtx.getImageData(0, 0, width, height);
        }
        
        function processImage() {
            if (!originalImageData) return;
            
            status.className = 'status processing';
            status.textContent = '🔄 Processing image...';
            
            setTimeout(() => {
                try {
                    const threshold = parseInt(thresholdSlider.value);
                    const blurAmount = parseInt(blurSlider.value);
                    
                    processedImageData = removeBackground(originalImageData, threshold, blurAmount);
                    resultCtx.putImageData(processedImageData, 0, 0);
                    
                    downloadBtn.style.display = 'inline-block';
                    status.className = 'status success';
                    status.textContent = '✅ Background removed successfully!';
                    
                    setTimeout(() => {
                        status.style.display = 'none';
                    }, 3000);
                } catch (error) {
                    status.className = 'status';
                    status.style.background = '#f8d7da';
                    status.style.color = '#721c24';
                    status.textContent = '❌ Error processing image';
                }
            }, 100);
        }
        
        function removeBackground(imageData, threshold, blurAmount) {
            const data = new Uint8ClampedArray(imageData.data);
            const width = imageData.width;
            const height = imageData.height;
            
            // Simple background removal based on color similarity to corners
            const cornerColors = [
                [data[0], data[1], data[2]], // top-left
                [data[(width-1)*4], data[(width-1)*4+1], data[(width-1)*4+2]], // top-right
                [data[(height-1)*width*4], data[(height-1)*width*4+1], data[(height-1)*width*4+2]], // bottom-left
                [data[((height-1)*width + width-1)*4], data[((height-1)*width + width-1)*4+1], data[((height-1)*width + width-1)*4+2]] // bottom-right
            ];
            
            // Average corner color as background reference
            const bgColor = [
                Math.round((cornerColors[0][0] + cornerColors[1][0] + cornerColors[2][0] + cornerColors[3][0]) / 4),
                Math.round((cornerColors[0][1] + cornerColors[1][1] + cornerColors[2][1] + cornerColors[3][1]) / 4),
                Math.round((cornerColors[0][2] + cornerColors[1][2] + cornerColors[2][2] + cornerColors[3][2]) / 4)
            ];
            
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Calculate color difference from background
                const diff = Math.sqrt(
                    Math.pow(r - bgColor[0], 2) +
                    Math.pow(g - bgColor[1], 2) +
                    Math.pow(b - bgColor[2], 2)
                );
                
                // If pixel is similar to background, make it transparent
                if (diff < threshold) {
                    data[i + 3] = 0; // Set alpha to 0 (transparent)
                } else {
                    // Keep original alpha or make it fully opaque
                    data[i + 3] = data[i + 3] || 255;
                }
            }
            
            return new ImageData(data, width, height);
        }
        
        function downloadImage() {
            if (!processedImageData) return;
            
            const link = document.createElement('a');
            link.download = 'background-removed.png';
            link.href = resultCanvas.toDataURL('image/png');
            link.click();
        }
        
        function resetSettings() {
            thresholdSlider.value = 50;
            blurSlider.value = 2;
            thresholdValue.textContent = '50';
            blurValue.textContent = '2';
        }
    </script>
</body>
</html>
